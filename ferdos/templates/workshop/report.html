{% extends 'main_template.html' %}

{% block content %}
    <h1 class='default'>
        گزارش کارگاه {{workshop_title}}
    </h1>
    <div class="card" style="text-align: center; font-size: 20px">
        <div class="card-header">
            {{report}}
        </div>
    </div>
    <div class="card" style="text-align: center; font-size: 20px">
        <div class="card-header">
            گالری تصاویر
        </div>
        {% for pic in pictures %}
            <div class="card-body" style="text-align: center;">
                <blockquote class="blockquote mb-0">
                <img src=/media/{{pic.picture}} alt='aa' width="850" height="565" >
            </div>
        {% endfor %}
    </div>
{% endblock %}
