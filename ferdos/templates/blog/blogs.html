{% extends "main_template.html" %}

{% block content %}
    <h1 class="default">
        مقالات
    </h1>
    {% for blog in blogs%}
        <div class="card" style="text-align: center; font-size: 20px">
            <div class="card-header">
                {{blog.article_title}}
            </div>
            <div class="card-body" style="text-align: center;">
                <blockquote class="blockquote mb-0">
                <img src=/media/{{blog.article_main_picture}} alt={{blog.article_title}} width="850" height="565" >
                <p>{{place.description}}</p>
                <p>{{blog.article_abstract}}</p>
                <p>نویسنده : {{blog.author}}</p>
                <p>دسته بندی : {{blog.group}}</p>
                <p>{{blog.views}} بازدید</p>
                <a href="{{blog.id}}/" class="btn btn-primary">مشاهده جزئیات</a>
                </blockquote>
            </div>
        </div>
    {% endfor %}
{% endblock %}
